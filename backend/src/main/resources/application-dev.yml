# Local development: the PostgreSQL, Keycloak and Mailpit containers from development/docker-compose.yml.
# Defaults match the compose defaults; override with the same variables as in development/.env.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${APP_DB_PORT:5432}/${APP_DB_NAME:alerts}
    username: ${APP_DB_USER:alerts}
    password: ${APP_DB_PASSWORD:alerts}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:sonrisa}
  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  notification:
    mail:
      from: ${MAIL_FROM:alerts@localhost}
      time-format: "yyyy-MM-dd HH:mm 'UTC'"
    slack:
      time-format: "yyyy-MM-dd HH:mm 'UTC'"
      connect-timeout: 5s
      read-timeout: 10s
