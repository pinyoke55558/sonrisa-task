<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Login (Keycloak)</title><link rel="stylesheet" href="mockup.css"></head>
<body>
<div class="browser">
  <div class="address"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">localhost:8180/realms/alerts/protocol/openid-connect/auth</span></div>
  <div style="display:flex;justify-content:center;padding:70px 20px 90px;background:#f7f6f2">

      <label>Username</label><input value="anna.smith" style="margin-bottom:14px">

    </div>
  </div>
